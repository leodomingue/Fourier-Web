<!DOCTYPE html>
<html>
<body style="background:#222; color:#eee; font-family: sans-serif;">
  <h3>Test de patterns.js</h3>

  <h4>Galería (imágenes de entrada)</h4>
  <canvas id="rayasV" width="128" height="128" style="border:1px solid #666"></canvas>
  <canvas id="rayasH" width="128" height="128" style="border:1px solid #666"></canvas>
  <canvas id="rayasD" width="128" height="128" style="border:1px solid #666"></canvas>
  <canvas id="tablero" width="128" height="128" style="border:1px solid #666"></canvas>
  <canvas id="circulos" width="128" height="128" style="border:1px solid #666"></canvas>

  <h4>Diccionario (muestras de frecuencias)</h4>
  <div id="diccionario" style="display:flex; gap:10px; flex-wrap:wrap;"></div>

  <script type="module">
    import {
      generarRayas, generarTablero, generarCirculos,
      generarPatronDeFrecuencia, describirFrecuencia
    } from './js/core/patterns.js';

    const N = 128;

    function pintar(idCanvas, datos) {
      const canvas = document.getElementById(idCanvas);
      const ctx = canvas.getContext('2d');
      const imgData = ctx.createImageData(N, N);
      for (let i = 0; i < N * N; i++) {
        const v = datos[i];
        imgData.data[i * 4] = v;
        imgData.data[i * 4 + 1] = v;
        imgData.data[i * 4 + 2] = v;
        imgData.data[i * 4 + 3] = 255;
      }
      ctx.putImageData(imgData, 0, 0);
    }

    pintar('rayasV', generarRayas(N, 'vertical', 8));
    pintar('rayasH', generarRayas(N, 'horizontal', 8));
    pintar('rayasD', generarRayas(N, 'diagonal', 8));
    pintar('tablero', generarTablero(N, 16));
    pintar('circulos', generarCirculos(N, 6));

    // Diccionario: unas cuantas frecuencias representativas
    const muestras = [
      [8, 0], [0, 8], [8, 8], [8, -8], [2, 0], [0, 2], [20, 5],
    ];
    const contenedor = document.getElementById('diccionario');
    for (const [u, v] of muestras) {
      const wrap = document.createElement('div');
      wrap.style.textAlign = 'center';
      const canvas = document.createElement('canvas');
      canvas.width = 80; canvas.height = 80;
      canvas.style.border = '1px solid #666';
      wrap.appendChild(canvas);
      const label = document.createElement('div');
      label.style.fontSize = '11px';
      label.style.maxWidth = '90px';
      label.textContent = `(${u},${v}): ${describirFrecuencia(u, v, N)}`;
      wrap.appendChild(label);
      contenedor.appendChild(wrap);

      const ctx = canvas.getContext('2d');
      const patron = generarPatronDeFrecuencia(u, v, N);
      const imgData = ctx.createImageData(N, N);
      for (let i = 0; i < N * N; i++) {
        const v2 = patron[i];
        imgData.data[i * 4] = v2;
        imgData.data[i * 4 + 1] = v2;
        imgData.data[i * 4 + 2] = v2;
        imgData.data[i * 4 + 3] = 255;
      }
      // Escalar de 128x128 a 80x80 usando un canvas intermedio
      const tmp = document.createElement('canvas');
      tmp.width = N; tmp.height = N;
      tmp.getContext('2d').putImageData(imgData, 0, 0);
      ctx.drawImage(tmp, 0, 0, 80, 80);
    }
  </script>
</body>
</html>
